<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RS ART</title>
    
    <!-- ICONO DE LA WEB (FAVICON) -->
    <link rel="icon" href="tu-icono.png" type="image/x-icon">
    
    <!-- Librerías -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root { --purple: #2D1B4E; --lime: #C6FF00; --magenta: #E91E63; --dark: #0F091A; }
        body { background: var(--dark); color: white; font-family: 'Inter', sans-serif; scroll-behavior: smooth; overflow-x: hidden; }
        
        .fade-in-up { animation: fadeInUp 0.6s ease-out both; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .premium-swal-popup {
            background: #0F091A !important;
            border: 1px solid rgba(198, 255, 0, 0.3) !important;
            border-radius: 30px !important;
            color: white !important;
            padding: 1.5rem !important;
        }
        @media (min-width: 768px) {
            .premium-swal-popup { border-radius: 40px !important; padding: 2.5rem !important; }
        }

        .premium-input {
            background: rgba(255,255,255,0.07) !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            color: white !important;
            border-radius: 15px !important;
            transition: 0.3s !important;
            font-size: 0.85rem !important;
        }
        .premium-input:focus { border-color: var(--lime) !important; box-shadow: 0 0 15px rgba(198, 255, 0, 0.2) !important; }

        .status-btn { transition: 0.4s; cursor: pointer; border: 2px solid transparent; position: relative; }
        .status-btn:hover { transform: translateY(-3px); filter: brightness(1.2); }
        .status-btn.active { border-color: white; box-shadow: 0 0 20px rgba(255,255,255,0.2); transform: scale(1.02); }

        .alarm-on { animation: police-flash 0.3s infinite; }
        @keyframes police-flash { 0% { background: #ff0000; } 50% { background: #0000ff; } 100% { background: #ff0000; } }

        .big-bell-container {
            background: linear-gradient(45deg, #e91e63, #2d1b4e);
            border: 3px solid var(--lime);
            box-shadow: 0 0 30px rgba(198, 255, 0, 0.2);
            transition: 0.3s;
        }
        @media (min-width: 768px) { .big-bell-container { border: 4px solid var(--lime); box-shadow: 0 0 40px rgba(198, 255, 0, 0.3); } }
        
        .bell-pulse { animation: bell-ring 2s infinite; }
        @keyframes bell-ring {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(233, 30, 99, 0.7); }
            70% { transform: scale(1.03); box-shadow: 0 0 0 15px rgba(233, 30, 99, 0); }
            100% { transform: scale(1); }
        }

        .swiper { width: 100%; height: 250px; border-radius: 20px; }
        @media (min-width: 768px) { .swiper { height: 400px; border-radius: 35px; } }

        .card-service { background: rgba(255,255,255,0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 25px; transition: 0.5s; overflow: hidden; cursor: pointer; }
        @media (min-width: 768px) { .card-service { border-radius: 30px; } }
        .card-service:hover { border-color: var(--lime); transform: translateY(-5px); }
        
        .section-header {
            background: linear-gradient(135deg, rgba(198,255,0,0.1), rgba(233,30,99,0.1));
            border: 1px solid rgba(198,255,0,0.2);
        }
        
        .btn-magenta { background: var(--magenta); transition: 0.4s; box-shadow: 0 8px 15px rgba(233, 30, 99, 0.2); }
        .btn-magenta:hover { filter: brightness(1.1); transform: translateY(-2px); }

        .admin-modal { background: #0F091A !important; z-index: 1000; }

        .status-rojo { border-left: 6px solid #ff4444 !important; background: rgba(255, 68, 68, 0.05); }
        .status-amarillo { border-left: 6px solid #ffbb33 !important; background: rgba(255, 187, 51, 0.05); }
        .status-verde { border-left: 6px solid #00c851 !important; background: rgba(0, 200, 81, 0.05); }

        .social-icon {
            transition: all 0.3s ease;
        }
        .social-icon:hover {
            transform: translateY(-5px);
            filter: drop-shadow(0 0 15px currentColor);
        }

        .descripcion-lista {
            list-style: none;
            padding-left: 0;
        }
        .descripcion-lista li {
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .descripcion-lista li i {
            color: var(--lime);
            font-size: 12px;
        }

        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body id="cuerpo">

    <nav class="p-4 md:p-6 border-b border-white/5 flex justify-between items-center sticky top-0 bg-[#0F091A]/90 backdrop-blur-xl z-[100]">

            <button onclick="modoAdmin()" class="w-10 h-10 md:w-12 md:h-12 rounded-xl md:rounded-2xl border border-white/10 flex items-center justify-center text-gray-500 hover:text-white transition-all"><i class="fas fa-cog"></i></button>

    <section class="container mx-auto p-4 md:p-6">

    <div id="panelAdmin" class="hidden fixed inset-0 z-[1000] admin-modal overflow-y-auto p-4 md:p-8">
        <div class="container mx-auto">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 border-b border-white/10 pb-6 gap-4">
                <div>
                    <h2 class="text-3xl md:text-5xl font-black text-[var(--lime)] tracking-tighter uppercase">SISTEMA ADMIN</h2>
                    <p class="text-gray-500 font-bold uppercase tracking-widest text-[10px] md:text-sm">Control Total de Operaciones</p>
                </div>
                <button onclick="cerrarAdmin()" class="absolute top-4 right-4 md:static bg-white/5 w-12 h-12 md:w-16 md:h-16 rounded-full text-2xl md:text-3xl hover:bg-red-500 transition-all">&times;</button>
            </div>

            <div class="grid grid-cols-1 xl:grid-cols-3 gap-6 md:gap-12">
                <!-- Configuración General -->
                <div class="space-y-6 md:space-y-8">
                    <div class="bg-white/5 p-6 md:p-8 rounded-[30px] md:rounded-[40px] border border-white/10">
                        <h3 class="text-xl md:text-2xl mb-4 md:mb-6 font-bold text-[var(--lime)] uppercase italic text-center">Configuración</h3>
                        <div class="space-y-4">
                            <input type="text" id="conf-exito-msg" placeholder="Mensaje de Éxito" class="w-full bg-black/40 p-4 rounded-xl border border-white/10 text-xs">
                            <input type="file" onchange="convertirBase64(this, 'exito-img')" class="text-[10px] text-gray-500">
                            <input type="hidden" id="adm-exito-img">
                            <div class="border-t border-white/10 pt-4 mt-2">
                                <label class="text-[var(--lime)] text-xs font-bold uppercase block mb-2">TASA DE CAMBIO (USD → Bs)</label>
                                <input type="number" id="conf-tasa" step="0.01" placeholder="Tasa del día" class="w-full bg-black/40 p-4 rounded-xl border border-white/10 text-xs">
                            </div>
                            <div class="border-t border-white/10 pt-4 mt-2">
                                <label class="text-[var(--lime)] text-xs font-bold uppercase block mb-2">NÚMERO WHATSAPP (con código país)</label>
                                <input type="text" id="conf-whatsapp" placeholder="Ej: 584123456789" class="w-full bg-black/40 p-4 rounded-xl border border-white/10 text-xs">
                            </div>
                            <button onclick="guardarConfigExito()" class="w-full bg-[var(--lime)] text-black font-black py-3 md:py-4 rounded-xl shadow-lg text-xs uppercase">Actualizar Todo</button>
                        </div>
                    </div>
                    <div class="bg-white/5 p-6 md:p-8 rounded-[30px] md:rounded-[40px] border border-white/10">
                        <h3 class="text-xl md:text-2xl mb-4 md:mb-6 font-bold text-[var(--magenta)] uppercase italic text-center">Bancos / Pago</h3>
                        <div class="space-y-4">
                            <textarea id="conf-pago-movil" class="w-full bg-black/40 p-4 rounded-xl border border-white/10 h-20 text-xs" placeholder="Pago Móvil (Número, cédula, banco)"></textarea>
                            <textarea id="conf-transferencia" class="w-full bg-black/40 p-4 rounded-xl border border-white/10 h-20 text-xs" placeholder="Transferencia (N° cuenta, banco, titular)"></textarea>
                            <textarea id="conf-efectivo" class="w-full bg-black/40 p-4 rounded-xl border border-white/10 h-20 text-xs" placeholder="Efectivo (Instrucciones para pago en efectivo)"></textarea>
                            <textarea id="conf-puntoventa" class="w-full bg-black/40 p-4 rounded-xl border border-white/10 h-20 text-xs" placeholder="Punto de Venta (Instrucciones)"></textarea>
                            <button onclick="guardarConfigPagos()" class="w-full bg-white/10 hover:bg-white/20 text-white font-black py-3 md:py-4 rounded-xl text-xs uppercase">Guardar Métodos de Pago</button>
                        </div>
                    </div>
                </div>

                <!-- Secciones -->
                <div class="bg-white/5 p-6 md:p-8 rounded-[30px] md:rounded-[40px] border border-white/10">
                    <h3 class="text-xl md:text-2xl mb-6 font-bold flex items-center gap-2 uppercase italic text-[var(--lime)]">SECCIONES</h3>
                    <div id="lista-secciones" class="space-y-3 mb-6 max-h-60 overflow-y-auto"></div>
                    <hr class="my-6 border-white/10">
                    <div class="space-y-4">
                        <input type="text" id="adm-sec-titulo" placeholder="Título de la Sección" class="w-full bg-black/40 p-4 rounded-xl border border-white/10 text-xs">
                        <button onclick="guardarSeccion()" class="w-full bg-[var(--magenta)] font-black py-3 md:py-4 rounded-xl text-xs uppercase">Agregar Sección</button>
                    </div>
                </div>

                <!-- Productos -->
                <div class="bg-white/5 p-6 md:p-8 rounded-[30px] md:rounded-[40px] border border-white/10">
                    <h3 class="text-xl md:text-2xl mb-6 font-bold flex items-center gap-2 uppercase italic text-[var(--lime)]">PRODUCTOS</h3>
                    <div id="inventario-lista" class="space-y-3 max-h-60 overflow-y-auto mb-4"></div>
                    <hr class="my-6 border-white/10">
                    <div class="space-y-4">
                        <select id="adm-seccion-select" class="w-full bg-black/40 p-4 rounded-xl border border-white/10 text-xs"></select>
                        <input type="text" id="adm-nombre" placeholder="Nombre Producto" class="w-full bg-black/40 p-4 rounded-xl border border-white/10 text-xs">
                        <input type="number" id="adm-precio" placeholder="Precio (USD)" class="w-full bg-black/40 p-4 rounded-xl border border-white/10 text-xs">
                        <input type="number" id="adm-stock" placeholder="Cantidad Disponible (Stock)" class="w-full bg-black/40 p-4 rounded-xl border border-white/10 text-xs">
                        <textarea id="adm-descripcion" placeholder="Descripción (cada línea es un ítem de la lista)" class="w-full bg-black/40 p-4 rounded-xl border border-white/10 h-24 text-xs"></textarea>
                        <input type="file" onchange="convertirBase64(this, 'img1')" class="text-[10px]">
                        <input type="hidden" id="adm-img1">
                        <button onclick="guardarProducto()" class="w-full bg-[var(--magenta)] font-black py-3 md:py-4 rounded-xl text-xs uppercase">Añadir Producto</button>
                    </div>
                </div>

                <!-- Pedidos -->
                <div class="bg-white/5 p-6 md:p-8 rounded-[30px] md:rounded-[40px] border border-white/10 col-span-1 xl:col-span-3">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-xl md:text-2xl font-bold uppercase italic">Pedidos</h3>
                        <div class="flex gap-2">
                            <button onclick="descargarPDF()" class="w-10 h-10 bg-orange-600 rounded-lg flex items-center justify-center"><i class="fas fa-file-pdf"></i></button>
                            <button onclick="borrarPedidos()" class="w-10 h-10 bg-red-600 rounded-lg flex items-center justify-center"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>
                    <div id="lista-pedidos" class="space-y-4 max-h-96 overflow-y-auto"></div>
                </div>
            </div>
        </div>

    <audio id="sonidoSirena" loop><source src="https://www.soundjay.com/buttons/sounds/beep-01a.mp3" type="audio/mpeg"></audio>

    <script>
        const firebaseConfig = { databaseURL: "https://rs-art-timbre-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let carrito = [];
        let productosData = [];
        let seccionesData = [];
        let configPagos = { movil: '', banco: '', efectivo: '', puntoventa: '' };
        let configExito = { mensaje: '¡GRACIAS POR ELEGIR RS ART!', imagen: '', tasa: 36, whatsapp: '584123456789' };
        
        let tasaCambio = 36;
        let numeroWhatsApp = '584123456789';

        new Swiper(".mySwiper", { loop: true, pagination: { el: ".swiper-pagination" }, autoplay: { delay: 4000 } });

        // Cargar configuraciones
        db.ref('configuracion').on('value', snap => {
            const data = snap.val();
            if(data) {
                if(data.pagos) configPagos = data.pagos;
                if(data.exito) {
                    configExito = data.exito;
                    tasaCambio = data.exito.tasa || 36;
                    numeroWhatsApp = data.exito.whatsapp || '584123456789';
                }
                document.getElementById('conf-pago-movil').value = configPagos.movil || '';
                document.getElementById('conf-transferencia').value = configPagos.banco || '';
                document.getElementById('conf-efectivo').value = configPagos.efectivo || '';
                document.getElementById('conf-puntoventa').value = configPagos.puntoventa || '';
                document.getElementById('conf-exito-msg').value = configExito.mensaje;
                document.getElementById('conf-tasa').value = tasaCambio;
                document.getElementById('conf-whatsapp').value = numeroWhatsApp;
            }
        });

        // Cargar secciones
        db.ref('secciones').on('value', snap => {
            seccionesData = [];
            const select = document.getElementById('adm-seccion-select');
            const listaSec = document.getElementById('lista-secciones');
            select.innerHTML = '<option value="">Seleccionar Sección</option>';
            listaSec.innerHTML = '';
            
            snap.forEach(child => {
                const sec = child.val();
                sec.key = child.key;
                seccionesData.push(sec);
                select.innerHTML += `<option value="${sec.key}">${sec.titulo}</option>`;
                listaSec.innerHTML += `
                    <div class="flex items-center justify-between bg-white/10 p-3 rounded-xl">
                        <span class="text-xs font-bold uppercase">${sec.titulo}</span>
                        <button onclick="eliminarSeccion('${sec.key}')" class="text-red-500 hover:text-red-400 transition text-sm"><i class="fas fa-trash"></i></button>
                    </div>
                `;
            });
            renderizarTodo();
        });

        function eliminarSeccion(key) {
            Swal.fire({
                title: '¿Eliminar sección?',
                text: 'Los productos dentro de esta sección también serán eliminados',
                icon: 'warning',
                background: '#0F091A',
                color: '#fff',
                confirmButtonColor: '#E91E63',
                cancelButtonColor: '#666',
                showCancelButton: true
            }).then(result => {
                if(result.isConfirmed) {
                    // Eliminar productos de esta sección
                    productosData.filter(p => p.seccionId === key).forEach(p => {
                        db.ref('productos/' + p.key).remove();
                    });
                    db.ref('secciones/' + key).remove();
                    Swal.fire('Eliminado', 'Sección y sus productos eliminados', 'success');
                }
            });
        }

        function guardarConfigPagos() {
            db.ref('configuracion/pagos').set({
                movil: document.getElementById('conf-pago-movil').value,
                banco: document.getElementById('conf-transferencia').value,
                efectivo: document.getElementById('conf-efectivo').value,
                puntoventa: document.getElementById('conf-puntoventa').value
            });
            Swal.fire("Éxito", "Métodos de pago actualizados", "success");
        }

        function guardarConfigExito() {
            const nuevaTasa = parseFloat(document.getElementById('conf-tasa').value);
            if(nuevaTasa && nuevaTasa > 0) tasaCambio = nuevaTasa;
            const nuevoWhatsApp = document.getElementById('conf-whatsapp').value;
            if(nuevoWhatsApp) numeroWhatsApp = nuevoWhatsApp;
            
            db.ref('configuracion/exito').set({
                mensaje: document.getElementById('conf-exito-msg').value,
                imagen: document.getElementById('adm-exito-img').value,
                tasa: tasaCambio,
                whatsapp: numeroWhatsApp
            });
            Swal.fire("Éxito", "Configuración guardada", "success");
        }

        db.ref('.info/connected').on('value', snap => {
            const s = document.getElementById('status-fb');
            s.innerText = snap.val() ? "SISTEMA ONLINE" : "OFFLINE";
            s.className = snap.val() ? "text-[8px] md:text-[10px] font-bold px-3 py-1 md:px-4 md:py-2 bg-lime-500/10 rounded-full text-lime-400 border border-lime-500/20" : "text-[8px] md:text-[10px] font-bold px-3 py-1 md:px-4 md:py-2 bg-red-500/10 rounded-full text-red-400 border border-red-500/20";
        });

        function convertirBase64(input, targetId) {
            const reader = new FileReader();
            reader.onloadend = () => { document.getElementById('adm-' + targetId).value = reader.result; };
            if (input.files[0]) reader.readAsDataURL(input.files[0]);
        }

        function guardarSeccion() {
            const titulo = document.getElementById('adm-sec-titulo').value;
            if(!titulo) return Swal.fire("Incompleto", "Escribe un título para la sección", "warning");
            
            db.ref('secciones').push({ titulo: titulo });
            document.getElementById('adm-sec-titulo').value = "";
            Swal.fire("Éxito", "Sección agregada", "success");
        }

        db.ref('productos').on('value', snap => {
            productosData = [];
            snap.forEach(child => {
                const p = child.val();
                p.key = child.key;
                productosData.push(p);
            });
            renderizarTodo();
        });

        function verDetalleProducto(p) {
            const itemsLista = p.descripcion ? p.descripcion.split('\n').filter(line => line.trim()) : [];
            
            Swal.fire({
                title: `<span class="text-2xl font-black italic">${p.nombre}</span>`,
                html: `
                    <div class="text-left">
                        <img src="${p.img1}" class="w-full h-48 object-cover rounded-xl mb-4">
                        <div class="bg-white/5 p-4 rounded-xl">
                            <h4 class="text-[var(--lime)] font-bold text-xs uppercase mb-3">✨ Características:</h4>
                            <ul class="descripcion-lista">
                                ${itemsLista.length > 0 ? itemsLista.map(item => `<li><i class="fas fa-check-circle"></i> ${item}</li>`).join('') : '<li><i class="fas fa-info-circle"></i> Sin descripción detallada</li>'}
                            </ul>
                        </div>
                        <div class="mt-4 text-center">
                            <p class="text-2xl font-black text-[var(--lime)]">$${parseFloat(p.precio).toLocaleString('de-DE')} USD</p>
                            <p class="text-xs text-gray-400">Stock disponible: ${p.stock || 0} unidades</p>
                        </div>
                    </div>
                `,
                background: '#0F091A',
                color: '#fff',
                confirmButtonText: 'CERRAR',
                confirmButtonColor: '#E91E63',
                customClass: { popup: 'rounded-3xl border border-[var(--lime)]/30' }
            });
        }

        function renderizarTodo() {
            const container = document.getElementById('lista-contenido');
            const inventario = document.getElementById('inventario-lista');
            container.innerHTML = "";
            inventario.innerHTML = "";
            
            // Renderizar inventario
            productosData.forEach(p => {
                const stockVal = p.stock || 0;
                inventario.innerHTML += `
                    <div class="flex items-center gap-3 bg-white/5 p-3 rounded-xl border border-white/5">
                        <img src="${p.img1}" class="w-10 h-10 rounded-lg object-cover">
                        <div class="flex-1 text-[10px] font-bold uppercase truncate">
                            ${p.nombre}<br>
                            <span class="text-[var(--lime)]">Cant: ${stockVal}</span><br>
                            <span class="text-gray-400">$${parseFloat(p.precio).toLocaleString('de-DE')}</span>
                        </div>
                        <button onclick="eliminarProducto('${p.key}')" class="text-red-500 text-sm"><i class="fas fa-trash"></i></button>
                    </div>`;
            });
            
            // Renderizar catálogo por secciones
            if(seccionesData.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-500 py-10">Agrega secciones en el panel de administrador</div>';
                return;
            }
            
            seccionesData.forEach(seccion => {
                const productosSeccion = productosData.filter(p => p.seccionId === seccion.key);
                
                let productosHTML = '';
                productosSeccion.forEach(p => {
                    const stockVal = p.stock || 0;
                    const isAgotado = stockVal <= 0;
                    
                    productosHTML += `
                        <div class="card-service" onclick="verDetalleProducto(${JSON.stringify(p).replace(/"/g, '&quot;')})">
                            <div class="h-48 md:h-64 overflow-hidden relative">
                                <img src="${p.img1}" class="w-full h-full object-cover transform hover:scale-110 transition duration-700">
                                ${isAgotado ? '<div class="absolute inset-0 bg-black/70 flex items-center justify-center font-black text-red-500 italic">AGOTADO</div>' : ''}
                            </div>
                            <div class="p-5 md:p-8" onclick="event.stopPropagation()">
                                <h3 class="text-lg md:text-2xl font-black italic uppercase tracking-tighter truncate">${p.nombre}</h3>
                                <p class="text-[10px] text-gray-500 font-bold uppercase mb-2">Disponibles: <span class="${stockVal < 5 ? 'text-red-500' : 'text-white'}">${stockVal}</span></p>
                                <div class="flex justify-between items-center mt-4">
                                    <p class="text-xl md:text-3xl font-black text-[var(--lime)] tracking-tighter">$${parseFloat(p.precio).toLocaleString('de-DE')} USD</p>
                                    <button onclick="${isAgotado ? '' : `alCarrito('${p.key}')`}" 
                                            class="${isAgotado ? 'bg-gray-700 cursor-not-allowed' : 'btn-magenta'} px-5 py-3 md:px-8 md:py-4 rounded-xl md:rounded-2xl text-[10px] font-black italic uppercase tracking-widest transition-all">
                                        ${isAgotado ? 'SIN STOCK' : 'Añadir'}
                                    </button>
                                </div>
                            </div>
                        </div>`;
                });
                
                if(productosSeccion.length > 0) {
                    container.innerHTML += `
                        <div class="section-header rounded-3xl p-6 md:p-8 mb-6">
                            <h2 class="text-3xl md:text-5xl font-black italic text-[var(--lime)] tracking-tighter">${seccion.titulo}</h2>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-10">
                            ${productosHTML}
                        </div>
                    `;
                }
            });
        }

        function alCarrito(key) {
            const prod = productosData.find(x => x.key === key);
            const existe = carrito.find(x => x.key === key);
            
            if(existe) {
                if(existe.cantidad < prod.stock) {
                    existe.cantidad += 1;
                } else {
                    return Swal.fire("Límite de Stock", "No hay más unidades disponibles", "warning");
                }
            } else {
                carrito.push({ ...prod, cantidad: 1 });
            }
            
            document.getElementById('cart-count').innerText = carrito.reduce((sum, p) => sum + p.cantidad, 0);
            const Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 1500, background: '#0F091A', color: '#fff' });
            Toast.fire({ icon: 'success', title: 'Agregado al estudio' });
        }

        function verCarrito() {
            if (carrito.length === 0) return Swal.fire({ title: "Carrito Vacío", icon: "info", background: '#0F091A', color: '#fff', confirmButtonColor: '#E91E63' });
            actualizarModalCarrito();
        }

        async function actualizarModalCarrito() {
            let totalUSD = carrito.reduce((s, p) => s + (parseFloat(p.precio) * p.cantidad), 0);
            let totalBs = totalUSD * tasaCambio;
            const isMobile = window.innerWidth < 768;

            const { value: formValues } = await Swal.fire({
                title: `<span class="${isMobile ? 'text-2xl' : 'text-4xl'} font-black italic tracking-tighter uppercase">Confirmar Compra</span>`,
                width: isMobile ? '95%' : '750px',
                padding: isMobile ? '1rem' : '2.5rem',
                customClass: {
                    popup: 'premium-swal-popup animate__animated animate__zoomIn',
                    confirmButton: 'btn-magenta rounded-xl md:rounded-2xl px-8 py-3 md:px-12 md:py-5 font-black italic uppercase tracking-widest text-xs md:text-base',
                    cancelButton: 'bg-white/10 rounded-xl md:rounded-2xl px-8 py-3 md:px-12 md:py-5 font-bold text-white ml-2 text-xs md:text-base'
                },
                html: `
                <div class="text-left mt-4 md:mt-8">
                    <div class="space-y-2 max-h-40 md:max-h-52 overflow-y-auto pr-2 mb-6 md:mb-8">
                        ${carrito.map((p, i) => `
                        <div class="flex items-center justify-between bg-white/5 p-3 md:p-4 rounded-xl md:rounded-2xl border border-white/5">
                            <div class="flex-1">
                                <h4 class="font-black text-[10px] md:text-xs uppercase truncate">${p.nombre}</h4>
                                <p class="text-[var(--lime)] font-bold text-[10px]">$${parseFloat(p.precio).toLocaleString('de-DE')} USD</p>
                            </div>
                            <div class="flex items-center gap-2 md:gap-5">
                                <button onclick="cambiarCant(${i},-1)" class="w-7 h-7 md:w-9 md:h-9 bg-white/10 rounded-lg md:rounded-xl hover:bg-[var(--magenta)] transition">-</button>
                                <span class="font-black text-sm md:text-xl w-4 text-center">${p.cantidad}</span>
                                <button onclick="cambiarCant(${i},1)" class="w-7 h-7 md:w-9 md:h-9 bg-white/10 rounded-lg md:rounded-xl hover:bg-[var(--lime)] hover:text-black transition">+</button>
                                <button onclick="eliminarDelCarrito(${i})" class="w-7 h-7 md:w-9 md:h-9 bg-red-500/20 rounded-lg md:rounded-xl hover:bg-red-500 transition text-red-400 hover:text-white"><i class="fas fa-trash text-xs"></i></button>
                            </div>
                        </div>`).join('')}
                    </div>

                    <div class="flex justify-between items-center bg-white/5 p-4 md:p-6 rounded-2xl md:rounded-3xl border border-white/10 mb-6 md:mb-10">
                        <span class="font-black text-xs md:text-lg italic uppercase">Total a Pagar</span>
                        <div class="text-right">
                            <p class="text-sm text-gray-400">$${totalUSD.toLocaleString('de-DE')} USD</p>
                            <p class="text-2xl md:text-4xl font-black text-[var(--lime)] tracking-tighter">Bs. ${totalBs.toLocaleString('de-DE')}</p>
                            <p class="text-[10px] text-gray-500">Tasa: Bs ${tasaCambio}/USD</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-10">
                        <div class="space-y-3 md:space-y-5">
                            <h5 class="text-[8px] md:text-[10px] font-black text-gray-500 uppercase tracking-widest ml-2">Método de Pago</h5>
                            <select id="swal-metodo" onchange="mostrarInfoPago(this.value)" class="premium-input w-full p-3 md:p-4 outline-none appearance-none">
                                <option value="">Seleccionar</option>
                                <option value="Pago Móvil">Pago Móvil</option>
                                <option value="Transferencia">Transferencia</option>
                                <option value="Efectivo">Efectivo</option>
                                <option value="Punto de Venta">Punto de Venta</option>
                            </select>
                            <div id="info-pago-box" class="p-4 bg-[var(--lime)]/10 rounded-xl text-[9px] md:text-[11px] hidden border border-[var(--lime)]/20 text-[var(--lime)] font-bold italic"></div>
                            <input type="text" id="swal-tel" placeholder="Teléfono de contacto" class="premium-input w-full p-3 md:p-4 outline-none">
                            <input type="text" id="swal-ref" placeholder="Referencia / N° de operación" class="premium-input w-full p-3 md:p-4 outline-none">
                            <input type="text" id="swal-nombre" placeholder="Tu Nombre Completo" class="premium-input w-full p-3 md:p-4 outline-none">
                        </div>

                        <div class="space-y-3 md:space-y-5">
                            <h5 class="text-[8px] md:text-[10px] font-black text-gray-500 uppercase tracking-widest ml-2">Tipo de Entrega</h5>
                            <div class="grid grid-cols-1 gap-2 md:gap-3">
                                <label onclick="selectStatus('rojo')" class="status-btn p-3 md:p-4 bg-red-600/10 border border-red-600/20 rounded-xl md:rounded-2xl flex items-center justify-between cursor-pointer" id="label-rojo">
                                    <span class="text-[8px] md:text-[10px] font-black italic uppercase tracking-widest">Urgente (24h)</span>
                                    <i class="fas fa-bolt text-red-500 text-sm md:text-lg"></i>
                                </label>
                                <label onclick="selectStatus('amarillo')" class="status-btn p-3 md:p-4 bg-orange-600/10 border border-orange-600/20 rounded-xl md:rounded-2xl flex items-center justify-between cursor-pointer" id="label-amarillo">
                                    <span class="text-[8px] md:text-[10px] font-black italic uppercase tracking-widest">Mediano (3 días)</span>
                                    <i class="fas fa-clock text-orange-500 text-sm md:text-lg"></i>
                                </label>
                                <label onclick="selectStatus('verde')" class="status-btn p-3 md:p-4 bg-green-600/10 border border-green-600/20 rounded-xl md:rounded-2xl flex items-center justify-between cursor-pointer" id="label-verde">
                                    <span class="text-[8px] md:text-[10px] font-black italic uppercase tracking-widest">Largo (7 días)</span>
                                    <i class="fas fa-calendar-alt text-green-500 text-sm md:text-lg"></i>
                                </label>
                                <input type="hidden" id="swal-status" value="rojo">
                            </div>
                        </div>
                    </div>
                    <div class="mt-6 md:mt-8">
                         <textarea id="swal-obs" placeholder="Detalles extra del pedido (dirección, etc)..." class="premium-input w-full p-4 md:p-5 h-20 md:h-28 outline-none resize-none"></textarea>
                    </div>
                </div>`,
                showCancelButton: true,
                confirmButtonText: 'CONFIRMAR PAGO',
                cancelButtonText: 'VOLVER',
                preConfirm: () => {
                    const m = document.getElementById('swal-metodo').value;
                    const t = document.getElementById('swal-tel').value;
                    const r = document.getElementById('swal-ref').value;
                    const n = document.getElementById('swal-nombre').value;
                    const s = document.getElementById('swal-status').value;
                    if(!m) { Swal.showValidationMessage('Selecciona un método de pago'); return false; }
                    if(!t) { Swal.showValidationMessage('Ingresa tu teléfono de contacto'); return false; }
                    if(m !== 'Efectivo' && m !== 'Punto de Venta' && !r) { Swal.showValidationMessage('Ingresa la referencia/número de operación'); return false; }
                    if(!n) { Swal.showValidationMessage('Ingresa tu nombre completo'); return false; }
                    return { metodo: m, tel: t, ref: r || 'Efectivo/Punto de Venta', status: s, obs: document.getElementById('swal-obs').value, nombre: n, totalUSD: totalUSD, totalBs: totalBs };
                }
            });

            if (formValues) {
                enviarPedido(formValues);
            }
        }

        window.eliminarDelCarrito = (i) => {
            carrito.splice(i, 1);
            document.getElementById('cart-count').innerText = carrito.reduce((sum, p) => sum + p.cantidad, 0);
            actualizarModalCarrito();
        };

        window.selectStatus = (val) => {
            document.querySelectorAll('.status-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('label-' + val).classList.add('active');
            document.getElementById('swal-status').value = val;
        };

        window.cambiarCant = (i, d) => {
            const item = carrito[i];
            const originalProd = productosData.find(x => x.key === item.key);
            
            if(d > 0 && item.cantidad >= originalProd.stock) {
                return Swal.fire("Límite de Stock", "No hay más unidades disponibles", "warning");
            }
            
            item.cantidad += d;
            if (item.cantidad < 1) carrito.splice(i, 1);
            document.getElementById('cart-count').innerText = carrito.reduce((sum, p) => sum + p.cantidad, 0);
            actualizarModalCarrito();
        };

        window.mostrarInfoPago = (v) => {
            const box = document.getElementById('info-pago-box');
            box.classList.remove('hidden');
            if(v === 'Pago Móvil') box.innerHTML = `📱 <strong>PAGO MÓVIL:</strong><br>${configPagos.movil || 'No configurado'}`;
            else if(v === 'Transferencia') box.innerHTML = `🏦 <strong>TRANSFERENCIA:</strong><br>${configPagos.banco || 'No configurado'}`;
            else if(v === 'Efectivo') box.innerHTML = `💵 <strong>EFECTIVO:</strong><br>${configPagos.efectivo || 'Pago en efectivo al recibir el producto'}`;
            else if(v === 'Punto de Venta') box.innerHTML = `💳 <strong>PUNTO DE VENTA:</strong><br>${configPagos.puntoventa || 'Pago con punto de venta al recibir'}`;
            else box.classList.add('hidden');
        }

        async function enviarPedido(d) {
            const pedido = {
                items: carrito.map(i => ({ nombre: i.nombre, cantidad: i.cantidad, precioUSD: i.precio })),
                totalUSD: d.totalUSD,
                totalBs: d.totalBs,
                metodo: d.metodo,
                tel: d.tel,
                ref: d.ref,
                nombre: d.nombre,
                obs: d.obs,
                fecha: new Date().toLocaleString(),
                status: d.status,
                tasa: tasaCambio
            };

            await db.ref('pedidos').push(pedido);
            
            for (const item of carrito) {
                const prodRef = db.ref(`productos/${item.key}/stock`);
                await prodRef.transaction((currentStock) => (currentStock || 0) - item.cantidad);
            }

            const facturaTexto = `📋 *FACTURA RS ART STUDIO*\n\n` +
                `👤 *Cliente:* ${d.nombre}\n` +
                `📅 *Fecha:* ${new Date().toLocaleString()}\n` +
                `━━━━━━━━━━━━━━━━━━━━\n` +
                `*DETALLE DEL PEDIDO:*\n` +
                carrito.map(i => `   ${i.nombre} x${i.cantidad} = $${(i.precio * i.cantidad).toLocaleString('de-DE')} USD`).join('\n') +
                `\n━━━━━━━━━━━━━━━━━━━━\n` +
                `💰 *TOTAL:* $${d.totalUSD.toLocaleString('de-DE')} USD\n` +
                `🇻🇪 *Total Bs:* Bs. ${d.totalBs.toLocaleString('de-DE')}\n` +
                `💵 *Tasa:* Bs ${tasaCambio}/USD\n` +
                `━━━━━━━━━━━━━━━━━━━━\n` +
                `💳 *Método de pago:* ${d.metodo}\n` +
                `📞 *Contacto:* ${d.tel}\n` +
                `🔑 *Referencia:* ${d.ref}\n` +
                `🚚 *Tipo de entrega:* ${d.status === 'rojo' ? 'URGENTE (24h)' : d.status === 'amarillo' ? 'MEDIANO (3 días)' : 'LARGO (7 días)'}\n` +
                `${d.obs ? `📝 *Dirección/Obs:* ${d.obs}\n` : ''}` +
                `━━━━━━━━━━━━━━━━━━━━\n` +
                `✨ *¡Gracias por tu compra!* ✨\n` +
                `🔔 *RS ART STUDIO*`;

            const mensajeCodificado = encodeURIComponent(facturaTexto);
            window.open(`https://wa.me/${numeroWhatsApp}?text=${mensajeCodificado}`, '_blank');

            db.ref('alarma_evento').set({ id: Math.random(), tipo: "COMPRA", info: `$${d.totalUSD} USD (${d.nombre})`, timestamp: Date.now() });
            carrito = [];
            document.getElementById('cart-count').innerText = "0";

            Swal.fire({
                title: `<span class="text-xl md:text-3xl font-black italic tracking-tighter uppercase">${configExito.mensaje}</span>`,
                html: `<p class="text-sm mt-2">Se ha enviado la factura a tu WhatsApp</p>`,
                imageUrl: configExito.imagen || 'https://via.placeholder.com/400x300?text=EXITO',
                imageWidth: 300,
                background: '#0F091A',
                color: '#fff',
                confirmButtonText: 'CERRAR',
                confirmButtonColor: '#E91E63',
                customClass: { popup: 'rounded-[30px] border border-[var(--lime)]/30' }
            });
        }

        function modoAdmin() {
            if(prompt("Clave:") === "2025") {
                document.getElementById('panelAdmin').classList.remove('hidden');
                escucharPedidos();
                activarMonitorAlarma();
            }
        }

        function cerrarAdmin() { document.getElementById('panelAdmin').classList.add('hidden'); }

        function escucharPedidos() {
            db.ref('pedidos').on('value', snap => {
                const list = document.getElementById('lista-pedidos');
                list.innerHTML = "";
                let peds = [];
                snap.forEach(child => { let p = child.val(); p.key = child.key; peds.push(p); });
                const orden = { 'rojo': 1, 'amarillo': 2, 'verde': 3 };
                peds.sort((a, b) => orden[a.status] - orden[b.status]);

                peds.forEach(ped => {
                    list.innerHTML += `
                        <div class="bg-black/60 p-4 md:p-6 rounded-2xl md:rounded-3xl status-${ped.status} animate__animated animate__fadeInRight">
                            <div class="flex justify-between items-start mb-2 md:mb-4">
                                <div>
                                    <span class="font-black text-[var(--lime)] text-sm md:text-xl italic">$${ped.totalUSD.toLocaleString('de-DE')} USD</span>
                                    <span class="text-xs text-gray-400 ml-2">(Bs. ${ped.totalBs.toLocaleString('de-DE')})</span>
                                </div>
                                <button onclick="borrarPedidoIndividual('${ped.key}')" class="w-8 h-8 md:w-10 md:h-10 bg-white/5 rounded-lg text-green-500 hover:bg-green-500 hover:text-white transition-all flex items-center justify-center text-xs"><i class="fas fa-check"></i></button>
                            </div>
                            <div class="space-y-1 text-[10px] md:text-xs">
                                <p><b class="text-gray-500 uppercase">Cliente:</b> ${ped.nombre || 'Anónimo'}</p>
                                <p><b class="text-gray-500 uppercase">Items:</b> ${ped.items.map(i => i.nombre + ' (x'+i.cantidad+')').join(', ')}</p>
                                <p><b class="text-gray-500 uppercase">Pago:</b> ${ped.metodo} | ${ped.tel}</p>
                                <p><b class="text-gray-500 uppercase">Ref:</b> <span class="text-white">${ped.ref}</span></p>
                                <p><b class="text-gray-500 uppercase">Entrega:</b> ${ped.status === 'rojo' ? 'URGENTE' : ped.status === 'amarillo' ? 'MEDIANO' : 'LARGO'}</p>
                                <p class="text-[8px] text-gray-600 mt-2">${ped.fecha}</p>
                            </div>
                        </div>`;
                });
            });
        }

        function borrarPedidoIndividual(k) { if(confirm("¿Marcar como completado y eliminar?")) db.ref('pedidos/' + k).remove(); }
        function descargarPDF() {
            const element = document.getElementById('lista-pedidos');
            html2pdf().set({ margin: 1, filename: 'pedidos_rs_art.pdf', jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' } }).from(element).save();
        }

        function guardarProducto() {
            const n = document.getElementById('adm-nombre').value;
            const p = document.getElementById('adm-precio').value;
            const s = document.getElementById('adm-stock').value;
            const i = document.getElementById('adm-img1').value;
            const sec = document.getElementById('adm-seccion-select').value;
            const desc = document.getElementById('adm-descripcion').value;
            if(!n || !p || !s || !i) return Swal.fire("Incompleto", "Llena todos los campos incluyendo imagen", "warning");
            if(!sec) return Swal.fire("Incompleto", "Selecciona una sección", "warning");
            
            db.ref('productos').push({ nombre: n, precio: parseFloat(p), stock: parseInt(s), img1: i, seccionId: sec, descripcion: desc });
            Swal.fire("Éxito", "Producto añadido", "success");
            document.getElementById('adm-nombre').value = "";
            document.getElementById('adm-precio').value = "";
            document.getElementById('adm-stock').value = "";
            document.getElementById('adm-descripcion').value = "";
        }

        function eliminarProducto(k) { if(confirm("¿Eliminar este producto?")) db.ref('productos/' + k).remove(); }
        function borrarPedidos() { if(confirm("¿Vaciar todos los pedidos?")) db.ref('pedidos').remove(); }
        
        function tocarTimbreSolo() {
            db.ref('alarma_evento').set({ id: Math.random(), tipo: "TIMBRE", info: "Atención cliente", timestamp: Date.now() });
            Swal.fire({ title: "NOTIFICANDO", icon: "success", timer: 1000, showConfirmButton: false, background: '#0F091A', color: '#fff' });
        }

        function activarMonitorAlarma() {
            db.ref('alarma_evento').on('value', snap => {
                const data = snap.val(); 
                if(!data) return;
                
                const ahora = Date.now();
                if(ahora - data.timestamp > 10000) return;

                const audio = document.getElementById('sonidoSirena');
                document.getElementById('cuerpo').classList.add('alarm-on');
                audio.play();
                Swal.fire({ 
                    title: data.tipo, 
                    text: data.info, 
                    icon: "warning", 
                    background: '#0F091A', 
                    color: '#fff', 
                    confirmButtonColor: '#E91E63' 
                }).then(() => {
                    audio.pause(); 
                    document.getElementById('cuerpo').classList.remove('alarm-on');
                });
            });
        }
    </script>
</body>
</html>
